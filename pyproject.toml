[project]
name = "agent-patterns-lab"
version = "0.1.0"
description = "Comparing LangGraph agent architectures on the same generated dungeon, scored by code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "langchain>=1.4.7,<2",
    "langchain-core>=1.7.3,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-openai>=1.7.3,<2",
    "langgraph>=1.2.18,<1.3",
    "openai>=3.41,<4",
]

[project.scripts]
apl = "apl.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "apl"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
